[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jobgpumonitor-server"
version = "0.3.0"
description = "Consumer for jobgpumonitor events: run state, alert rules, notifications (ntfy, Telegram, webhook) and a small API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Marc Pinet" }]
keywords = ["slurm", "oar", "hpc", "gpu", "monitoring", "notifications", "ntfy"]
dependencies = []

[project.optional-dependencies]
toml = ["tomli>=2; python_version < '3.11'"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "jobgpumonitor>=0.1.0", "httpx>=0.27", "fastapi>=0.110", "tomli>=2; python_version < '3.11'"]

[project.scripts]
jgmd = "jobgpumonitor_server.cli:main"

[project.urls]
Homepage = "https://github.com/marcpinet/jobgpumonitor-server"

[tool.hatch.build.targets.wheel]
packages = ["src/jobgpumonitor_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP035", "UP007", "UP045", "B008"]

